name: Build distribution

on: [push, pull_request]

jobs:
  app:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Check app startup options
        run: bash tests/test_app_startup.sh
      - name: Build app and check installed dependencies
        run: docker build .

  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Python setup
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Check style
        run: python -m pip install flake8 && flake8 bluetti_mqtt

      - name: Test bridge
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v

      - name: Install build dependencies
        run: python -m pip install build

      - name: Build distributions
        run: python -m build

      - name: Publish to Test PyPI
        if: github.repository == 'warhammerkid/bluetti_mqtt'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip_existing: true
          repository_url: https://test.pypi.org/legacy/

      - name: Publish tagged to PyPI
        if: github.repository == 'warhammerkid/bluetti_mqtt' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
