name: Bluetti to MQTT
version: "0.16.4"
slug: bluetti_ac60_mqtt
description: Bluetooth to MQTT bridge for Bluetti power stations.
url: https://github.com/dbustosrc/bluetti_mqtt
arch:
  - amd64
  - aarch64
boot: manual
init: false
host_dbus: true
services:
  - mqtt:want
options:
  mqtt_username: ""
  mqtt_password: ""
  mqtt_host: ""
  mqtt_port: ""
  ha_config: normal
  bt_mac: ""
  poll_sec: 15
  scan: false
  debug: false
schema:
  mqtt_username: str?
  mqtt_password: password?
  mqtt_host: str?
  mqtt_port: str?
  ha_config: list(normal|none|advanced)
  bt_mac: "match(^$|^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}( ([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2})*$)"
  poll_sec: int(1,3600)
  scan: bool
  debug: bool
